# Publica a versão de demonstração do Rolê (sem servidor) no GitHub Pages
# a cada atualização da main: https://moshikgueta.github.io/Rol-/
name: Publicar demo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site em modo demonstração
        run: |
          mkdir -p _site
          cp -r public/. _site/
          echo 'window.ROLE_CONFIG = { demo: true };' > _site/config.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
