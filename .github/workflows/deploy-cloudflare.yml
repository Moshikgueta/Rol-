# Publica o Rolê (Worker + site + API) na Cloudflare a cada atualização da main.
#
# Precisa de dois secrets no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token de API da Cloudflare
#   CLOUDFLARE_ACCOUNT_ID  ID da sua conta Cloudflare
# Sem eles, o workflow só avisa e não falha.
#
# A cada deploy, as migrations novas do banco D1 são aplicadas (as já aplicadas são puladas).
# Para colocar (ou renovar os horários dos) rolês de exemplo, rode manualmente em
# Actions → "Deploy na Cloudflare" → Run workflow, marcando "Carregar dados de exemplo".
name: Deploy na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Carregar/renovar os rolês de exemplo (seed/seed.sql)"
        type: boolean
        default: false

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir configuração
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID. Deploy pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Conferir o ID do banco D1
        if: steps.check.outputs.ready == 'true'
        run: |
          if grep -q "COLE_AQUI_O_ID_DO_D1" wrangler.jsonc; then
            echo "::error::Troque COLE_AQUI_O_ID_DO_D1 em wrangler.jsonc pelo Database ID do banco role-db."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Aplicar migrations do D1
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply role-db --remote

      - name: Carregar dados de exemplo
        if: steps.check.outputs.ready == 'true' && inputs.seed
        run: npx wrangler d1 execute role-db --remote --file=seed/seed.sql

      - name: Publicar
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
